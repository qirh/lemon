name: Docs Site

# Builds the VitePress docs site and checks for broken links.
#
# On pull requests: build + link-check (no deploy).
# On push to main:  build + link-check; deploy only when explicitly enabled.
# workflow_dispatch: manual trigger for either environment.
#
# The docs site is OPTIONAL — it supplements but does not replace the
# repo markdown files, which remain the source of truth.
# See docs/README.md and docs/.vitepress/config.js.

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/generate_docs_llms.py"
      - "scripts/verify_docs_site"
      - ".github/workflows/docs-site.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/generate_docs_llms.py"
      - "scripts/verify_docs_site"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages? (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build + link check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # VitePress uses git history for lastUpdated

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs deps
        working-directory: docs
        run: npm ci

      - name: Verify source links
        working-directory: docs
        run: npm test

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Verify generated assets
        run: |
          test -s docs/.vitepress/dist/llms.txt
          test -s docs/.vitepress/dist/llms-full.txt

      - name: Check internal markdown links
        working-directory: docs
        run: npm run link-check
      - name: Upload build artifact (for deployment)
        if: >
          vars.ENABLE_PAGES_DEPLOY == 'true' &&
          (github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-check
    if: >
      vars.ENABLE_PAGES_DEPLOY == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
